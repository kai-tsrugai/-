<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホの拡大・縮小を防止し画面いっぱいに表示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ソウル・アリーナ - スマホ対応版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* スマホのデフォルトスクロール等を無効化 */
    }

    body {
      background-color: #121218;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 110px; /* 下部広告領域の確保 */
      overflow: hidden;
    }

    /* ヘッダー情報 */
    .header-info {
      width: 100%;
      max-width: 500px;
      padding: 6px 12px;
      background: #1e1e28;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 12px;
      border-bottom: 2px solid #3a3a4c;
      box-sizing: border-box;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .info-val {
      font-weight: bold;
      color: #00ffcc;
      font-size: 13px;
    }

    /* ゲームエリア容器 */
    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background-color: #1e1e28;
      width: 100%;
      height: auto;
      max-height: 55vh;
      touch-action: none;
    }

    /* タッチコントローラーエリア */
    .controls-container {
      width: 100%;
      max-width: 500px;
      height: 140px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      box-sizing: border-box;
      background: #14141c;
      border-top: 2px solid #3a3a4c;
    }

    /* バーチャルジョイスティック */
    .joystick-base {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .joystick-stick {
      width: 44px;
      height: 44px;
      background: rgba(0, 255, 204, 0.6);
      border: 2px solid #00ffcc;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    /* 攻撃ボタン */
    .attack-btn {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff9900, #ff3300);
      border: 3px solid #ffcc00;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 102, 0, 0.5);
      cursor: pointer;
    }

    .attack-btn:active {
      transform: scale(0.92);
      background: linear-gradient(135deg, #e68500, #cc2900);
    }

    /* モーダル（鍛冶屋・祭壇） */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #252535;
      border: 3px solid #ffcc00;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
    }

    .modal-title {
      font-size: 20px;
      color: #ffcc00;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .modal-desc {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, #ff9900, #ff5500);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .modal-btn:disabled {
      opacity: 0.4;
      background: #555;
    }

    .close-btn {
      background: #444;
      color: #ccc;
    }

    /* 画面下部 固定広告 */
    .fixed-bottom-ad-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 18, 24, 0.95);
      border-top: 1px solid #333;
      padding: 5px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 9999;
    }

    .fixed-bottom-ad {
      display: inline-block;
      min-width: 300px;
      min-height: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ステータスヘッダー -->
  <div class="header-info">
    <div class="info-item">
      <span>HP</span>
      <span class="info-val" id="hpVal">100/100</span>
    </div>
    <div class="info-item">
      <span>攻撃力</span>
      <span class="info-val" id="atkVal">15</span>
    </div>
    <div class="info-item">
      <span>攻撃速度</span>
      <span class="info-val" id="spdVal">1.0x</span>
    </div>
    <div class="info-item">
      <span>鉱石(鍛冶)</span>
      <span class="info-val" id="oreVal" style="color: #ff9900;">0</span>
    </div>
    <div class="info-item">
      <span>ソウル(祭壇)</span>
      <span class="info-val" id="soulVal" style="color: #bc70ff;">0</span>
    </div>
  </div>

  <div class="game-wrapper">
    <!-- キャンバス（ゲーム画面） -->
    <canvas id="gameCanvas" width="360" height="420"></canvas>

    <!-- スマホ用タッチ操作パネル -->
    <div class="controls-container">
      <div class="joystick-base" id="joyBase">
        <div class="joystick-stick" id="joyStick"></div>
      </div>
      <div class="attack-btn" id="attackBtn">攻撃</div>
    </div>
  </div>

  <!-- 鍛冶屋モーダル -->
  <div class="modal-overlay" id="blacksmithModal">
    <div class="modal-content">
      <div class="modal-title">🛠️ 鍛冶屋</div>
      <div class="modal-desc">鉱石を消費して武器を鍛え、**【攻撃力】**をアップ！</div>
      <button class="modal-btn" id="upgradeAtkBtn" onclick="upgradeAtk()">
        攻撃力 UP (+8)<br>
        <small id="atkCostText">必要: 鉱石 3個</small>
      </button>

      <button class="modal-btn close-btn" onclick="closeModal()">戦場に戻る</button>
    </div>
  </div>

  <!-- 祭壇モーダル -->
  <div class="modal-overlay" id="altarModal">
    <div class="modal-content" style="border-color: #bc70ff;">
      <div class="modal-title" style="color: #bc70ff;">🔮 修練の祭壇</div>
      <div class="modal-desc">ソウルを捧げて身のこなしを鋭くし、**【攻撃速度】**をアップ！</div>
      <button class="modal-btn" id="upgradeSpdBtn" style="background: linear-gradient(135deg, #a040ff, #7000cc);" onclick="upgradeSpd()">
        攻撃速度 UP (+20%)<br>
        <small id="spdCostText">必要: ソウル 3個</small>
      </button>

      <button class="modal-btn close-btn" onclick="closeModal()">戦場に戻る</button>
    </div>
  </div>

  <!-- 画面下部 固定広告 -->
  <div class="fixed-bottom-ad-container">
    <div class="fixed-bottom-ad">
      <!-- admax -->
      <script src="https://adm.shinobi.jp/s/5235ee24a3bda74d9a1d05e10baf3d94"></script>
      <!-- admax -->
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // プレイヤー設定
    const player = {
      x: 180,
      y: 260,
      radius: 13,
      speed: 2.8,
      hp: 100,
      maxHp: 100,
      atk: 15,
      atkLevel: 1,
      spdLevel: 1,
      attackCooldown: 0,
      attackAngle: -Math.PI / 2,
      isAttacking: false,
      ores: 0,
      souls: 0
    };

    // 施設設定
    const blacksmith = { x: 60, y: 60, radius: 24, color: '#ff9900', label: '🛠️鍛冶屋' };
    const altar = { x: 300, y: 60, radius: 24, color: '#bc70ff', label: '🔮祭壇' };

    // 移動入力ベクトル (-1.0 ～ 1.0)
    let moveInput = { x: 0, y: 0 };
    let isAttackPressed = false;

    // --- ジョイスティック & タッチ処理 ---
    const joyBase = document.getElementById('joyBase');
    const joyStick = document.getElementById('joyStick');
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };

    joyBase.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyBase.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoystick(touch);
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (joyTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          updateJoystick(e.changedTouches[i]);
          break;
        }
      }
    }, { passive: false });

    function resetJoystick() {
      joyTouchId = null;
      joyStick.style.transform = `translate(0px, 0px)`;
      moveInput = { x: 0, y: 0 };
    }

    window.addEventListener('touchend', e => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) resetJoystick();
      }
    });
    window.addEventListener('touchcancel', resetJoystick);

    function updateJoystick(touch) {
      const maxRadius = 38;
      let dx = touch.clientX - joyCenter.x;
      let dy = touch.clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
      moveInput = { x: dx / maxRadius, y: dy / maxRadius };
    }

    // --- 攻撃ボタン処理 ---
    const attackBtn = document.getElementById('attackBtn');
    attackBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      isAttackPressed = true;
    }, { passive: false });
    attackBtn.addEventListener('touchend', () => isAttackPressed = false);

    // PC用キーボード操作サポート
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // 敵・アイテム
    let enemies = [];
    let items = [];

    function spawnEnemy() {
      if (enemies.length >= 5) return;
      let x, y;
      do {
        x = Math.random() * (canvas.width - 50) + 25;
        y = Math.random() * (canvas.height - 120) + 100;
      } while (Math.hypot(player.x - x, player.y - y) < 100);

      enemies.push({
        x: x, y: y, radius: 12, hp: 35, maxHp: 35, speed: 1.1, color: '#ff4444'
      });
    }

    // 施設近接 & モーダル処理
    let activeModal = null;

    function checkFacilityProximity() {
      if (activeModal) return;

      if (Math.hypot(player.x - blacksmith.x, player.y - blacksmith.y) < player.radius + blacksmith.radius + 5) {
        openModal('blacksmith');
      } else if (Math.hypot(player.x - altar.x, player.y - altar.y) < player.radius + altar.radius + 5) {
        openModal('altar');
      }
    }

    function openModal(type) {
      activeModal = type;
      resetJoystick();
      if (type === 'blacksmith') document.getElementById('blacksmithModal').style.display = 'flex';
      if (type === 'altar') document.getElementById('altarModal').style.display = 'flex';
      updateUI();
    }

    function closeModal() {
      document.getElementById('blacksmithModal').style.display = 'none';
      document.getElementById('altarModal').style.display = 'none';
      activeModal = null;
      player.y += 12; // 施設から少し離す
    }

    // 強化処理
    function getAtkCost() { return player.atkLevel * 3; }
    function getSpdCost() { return player.spdLevel * 3; }

    function upgradeAtk() {
      const cost = getAtkCost();
      if (player.ores >= cost) {
        player.ores -= cost;
        player.atkLevel++;
        player.atk += 8;
        updateUI();
      }
    }

    function upgradeSpd() {
      const cost = getSpdCost();
      if (player.souls >= cost) {
        player.souls -= cost;
        player.spdLevel++;
        updateUI();
      }
    }

    function updateUI() {
      document.getElementById('hpVal').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;
      document.getElementById('atkVal').innerText = player.atk;
      const spdMult = (1 + (player.spdLevel - 1) * 0.2).toFixed(1);
      document.getElementById('spdVal').innerText = `${spdMult}x`;
      document.getElementById('oreVal').innerText = player.ores;
      document.getElementById('soulVal').innerText = player.souls;

      const atkCost = getAtkCost();
      document.getElementById('atkCostText').innerText = `必要: 鉱石 ${atkCost}個`;
      document.getElementById('upgradeAtkBtn').disabled = player.ores < atkCost;

      const spdCost = getSpdCost();
      document.getElementById('spdCostText').innerText = `必要: ソウル ${spdCost}個`;
      document.getElementById('upgradeSpdBtn').disabled = player.souls < spdCost;
    }

    // ゲーム更新ループ
    function update() {
      if (activeModal) return;

      // 移動入力取得（ジョイスティック優先、なければキーボード）
      let dx = moveInput.x;
      let dy = moveInput.y;

      if (dx === 0 && dy === 0) {
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
      }

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * player.speed;
        player.y += (dy / len) * player.speed;
        player.attackAngle = Math.atan2(dy, dx);
      }

      // 画面境界
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // 攻撃クールダウン & 発動
      const cooldownMax = Math.max(6, 22 - (player.spdLevel - 1) * 3);
      if (player.attackCooldown > 0) player.attackCooldown--;

      const wantsAttack = isAttackPressed || keys['Space'];

      if (wantsAttack && player.attackCooldown <= 0) {
        player.isAttacking = true;
        player.attackCooldown = cooldownMax;

        // 攻撃判定
        const attackRange = 40;
        enemies.forEach(e => {
          const dist = Math.hypot(e.x - player.x, e.y - player.y);
          if (dist < attackRange + e.radius) {
            const angleToEnemy = Math.atan2(e.y - player.y, e.x - player.x);
            let diff = Math.abs(angleToEnemy - player.attackAngle);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;

            if (diff < Math.PI / 2.5) {
              e.hp -= player.atk;
              e.x += Math.cos(angleToEnemy) * 12;
              e.y += Math.sin(angleToEnemy) * 12;
            }
          }
        });
      } else {
        player.isAttacking = false;
      }

      // 敵処理
      if (Math.random() < 0.03) spawnEnemy();

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // 被ダメージ
        if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
          player.hp -= 0.35;
          if (player.hp <= 0) {
            alert('倒れてしまった…！やり直します。');
            player.hp = player.maxHp;
            player.x = 180;
            player.y = 260;
            enemies = [];
            items = [];
          }
          updateUI();
        }

        // 撃破 & ドロップ
        if (e.hp <= 0) {
          const isOre = Math.random() < 0.5;
          items.push({
            x: e.x, y: e.y,
            type: isOre ? 'ore' : 'soul',
            color: isOre ? '#ff9900' : '#bc70ff'
          });
          enemies.splice(i, 1);
        }
      }

      // アイテム拾い
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + 10) {
          if (item.type === 'ore') player.ores++;
          else player.souls++;
          items.splice(i, 1);
          updateUI();
        }
      }

      checkFacilityProximity();
    }

    // 描画処理
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 鍛冶屋
      ctx.beginPath();
      ctx.arc(blacksmith.x, blacksmith.y, blacksmith.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 153, 0, 0.2)';
      ctx.fill();
      ctx.strokeStyle = blacksmith.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = blacksmith.color;
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(blacksmith.label, blacksmith.x, blacksmith.y + 4);

      // 祭壇
      ctx.beginPath();
      ctx.arc(altar.x, altar.y, altar.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(188, 112, 255, 0.2)';
      ctx.fill();
      ctx.strokeStyle = altar.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = altar.color;
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(altar.label, altar.x, altar.y + 4);

      // ドロップアイテム
      items.forEach(item => {
        ctx.beginPath();
        ctx.arc(item.x, item.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = item.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // 敵
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = e.color;
        ctx.fill();

        // HPバー
        const barW = e.radius * 2;
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - e.radius, e.y - e.radius - 5, barW, 3);
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(e.x - e.radius, e.y - e.radius - 5, barW * (e.hp / e.maxHp), 3);
      });

      // 斬撃エフェクト
      if (player.isAttacking) {
        ctx.beginPath();
        ctx.arc(
          player.x, player.y, 38,
          player.attackAngle - Math.PI / 3,
          player.attackAngle + Math.PI / 3
        );
        ctx.strokeStyle = 'rgba(255, 204, 0, 0.85)';
        ctx.lineWidth = 5;
        ctx.stroke();
      }

      // プレイヤー
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#00ffcc';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 向きガイド
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(
        player.x + Math.cos(player.attackAngle) * 18,
        player.y + Math.sin(player.attackAngle) * 18
      );
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    updateUI();
    gameLoop();
  </script>
</body>
</html>
